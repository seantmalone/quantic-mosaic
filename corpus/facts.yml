# corpus/facts.yml — the fact index into the hand-authored policy corpus.
#
# Every entry names one checkable statement in one document. `quote` is reproduced VERBATIM from the
# rendered text of `doc_id`; `section` is the " > "-joined heading path of the section it sits in, with
# the document title excluded (the title travels separately as `doc_title` in every citation).
#
# `scripts/check_facts.py` and `tests/unit/test_facts_quotes.py` assert both properties for every entry.
# Evaluation gold answers and `corpus/rules.yml` cite these keys, never prose, so a corpus edit that moves
# a number fails the build before it can contradict a gold answer.

facts_version: "2026.1"


# The package is installed (`pip install -e .`, the last step of `make setup`), so
# `python -m hrmosaic...` works from an activated venv with no PYTHONPATH prefix.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hrmosaic"
version = "0.1.0"
description = "Mosaic HR Copilot — an agentic HR assistant over RAG + MCP"
readme = "README.md"
requires-python = "==3.12.*"

# Authoritative dependency list. `requirements.txt` and `requirements-dev.txt` are
# compiled from this file with `uv pip compile` (see the `lock` recipe in the Makefile)
# and committed with exact pins; the Docker image installs `requirements.txt` alone.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "jinja2==3.1.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.13.0",
    "httpx==0.28.1",
    # `agent/client.py` imports `httpx2` at module level (the MCP 2.x transport's own HTTP layer,
    # which both provider SDKs also ship), so it is a direct dependency of this package and not
    # only a transitive one: pinning it here is what keeps that import from resolving to whatever
    # version `mcp` or `anthropic` happens to pull next.
    "httpx2==2.12.0",
    "fastembed==0.8.0",
    "sqlite-vec==0.1.9",
    "mcp==2.2.0",
    "anthropic==1.4.0",
    "openai==2.54.0",
    "pypdf==6.18.0",
    "beautifulsoup4==4.15.0",
    "markdownify==1.2.3",
    "PyYAML==6.0.3",
    "jsonschema==4.26.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
    "fpdf2==2.8.4",
    # The coverage gate of `make coverage` and the CI `test` job. A test tool, so it is pinned
    # here with the others and compiled into `requirements-dev.txt`; the Docker image installs
    # `requirements.txt` alone and never sees it.
    "coverage==7.10.7",
]

# src layout: the importable packages live under `src/`, nothing at the repo root.
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# The three Jinja prompts of §7.2 are package data, not source: `agent/prompts/__init__.py` loads
# them from disk relative to itself, so a non-editable install (the Docker image) must ship them.
[tool.setuptools.package-data]
"hrmosaic.agent.prompts" = ["*.j2"]
# Same argument for the web layer (P9): `web/templates/` and `web/static/` are data directories
# with no `__init__.py`, loaded from disk relative to `web/`, so a non-editable install must ship
# them or every page 500s and every vendored asset 404s. The Docker image reaches them through
# `PYTHONPATH=/app/src` rather than through a wheel, and asserts they arrived at build time.
"hrmosaic.web" = ["templates/*.html", "templates/**/*.html", "static/*", "static/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
# ruff formats Python code blocks inside Markdown; the documents are hand-authored
# deliverables, so they are linted by their own contract tests, never reformatted here.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The repository has a top-level `mcp/` directory (DOCS.8, spec §4.1). It is not a package — it has
# no `__init__.py`, so `import mcp` resolves to the installed SDK — but isort classifies by directory
# name, so without this it would sort the SDK into the first-party block.
known-third-party = ["mcp", "mcp_types"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Constraint 12 asks for "output pristine (no warnings)" — enforced here rather than merely
# asserted in a report. The list form leaves room for a targeted
# `"ignore:<message>:DeprecationWarning:<module>"` entry if a pinned dependency ever needs one;
# every pin is exact, so nothing can start warning without a deliberate commit that says so.
filterwarnings = ["error"]
# `--strict-markers`: a typo'd mark (`@pytest.mark.anyoi`) is an error, not a silently inert test.
# `--strict-config`: an unknown key in this very table is an error too — the same class of typo.
addopts = "--strict-markers --strict-config"

    verdict: grounded
    rationale: >-
      Every claim is verbatim in the chunks — the 90-day medical/dental/vision waiting period,
      coverage starting the day it ends, the 26-week break-in-service restart and the no-waiting
      401(k) in c_7566e6e377678fcd, life/AD&D cover beginning with the medical waiting period in
      c_88f9cf68022eeaea, and week-one enrolment in c_5892cd18e5f9cae8.

  - item_id: benefits-002
    verdict: grounded
    rationale: >-
      The one employee-specific claim, that the 90-day waiting period ends 2026-11-13 as of
      2026-09-01, is exactly the `waiting_period_ends` field of the structured record
      lookup_benefits_status#1, and the 90-day rule, the 30-day election window and the
      employee-only default all come from c_7566e6e377678fcd.

  - item_id: conduct-001
    verdict: grounded
    rationale: >-
      The three published timelines each have a source — 2 business days to acknowledge and 30
      calendar days to complete an investigation in c_faa7e3e074e0f281, the 4-business-hour
      Severity 1 response in c_8befbf9c1eefd50e, and "as fast as the facts allow" as the Severity 1
      resolution target in c_8e5b6fa6417ebbd2.

  - item_id: expenses-001
    verdict: grounded
    rationale: >-
      The deciding claim, USD 750 per plan year for home office furniture and accessories, is stated
      in c_c0b4b1d7c6436137, which also carries the 1 January reset, the hybrid/remote eligibility
      rule, the excluded IT equipment, the taxability note and the post-1-October new-hire rule.

  - item_id: expenses-002
    verdict: grounded
    rationale: >-
      All four asked-for figures are sourced — the 14-calendar-day flight booking rule and manager
      approval before booking in c_337bde2666993ccd, the USD 250 nightly lodging cap in

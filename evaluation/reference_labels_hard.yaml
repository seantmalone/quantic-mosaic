  - item_id: leave-001
    verdict: grounded
    rationale: >-
      The sole policy claim, 16 weeks of fully paid parental leave for every eligible new parent
      regardless of how they became a parent, is verbatim in c_4ba83fb1511ae9aa, which also carries
      the 6-months-continuous-service eligibility named in the next steps.

  - item_id: pto-003
    verdict: grounded
    rationale: >-
      The 5-business-day notice rule comes from c_16186f87d12c1302, the written-manager-approval
      requirement from c_d57a7964d974ba44, "PTO requests of any length are approved by the direct
      manager" from c_9948839107acfaaf, and the 13.5 remaining days and balance sufficiency from

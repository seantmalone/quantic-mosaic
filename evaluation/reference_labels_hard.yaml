      it ends, the 401(k) having no waiting period, and the transfer/26-week break rules all
      come from c_7566e6e377678fcd; life cover beginning when the medical waiting period ends is
      in c_88f9cf68022eeaea, and week-one enrolment plus MosaicOne Benefits are in
      c_5892cd18e5f9cae8.

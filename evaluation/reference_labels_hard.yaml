# evaluation/reference_labels_hard.yaml — the disclosed hard-case reference labels (spec §13.7).
#
# The SECOND of two judge-validation subsets, and the reason it exists: the blind `seed_1729_8`
# subset of `reference_labels.yaml` came back 8/8 `grounded` on both sides. Every cell of its
# agreement matrix but the top-left is empty, so `judge_agreement_rate = 1.000` over it measures
# agreement on the half of the decision a judge is least likely to get wrong, and cannot separate a
# good judge from one that answers `grounded` to everything.
#
# This subset attacks that directly: the eight items with the LOWEST judge groundedness in the
# judged baseline, ties broken by item id (`evaluation.schema.judge_lowest_subset()`), so whatever
# disagreement the run contains is inside the sample.
#
# The price is that the SELECTION uses the judge's own scores and is therefore NOT blind. That is
# recorded here as `selection_disclosed: true`, stated in REPORT.md beside the figure, and it is why
# `judge_agreement_rate_hard` is published as its own metric with its own n rather than merged into
# `judge_agreement_rate`. The LABELLING is blind in exactly the same way as the first subset's: the
# same packet shape, the same four §13.3 evidence classes, and no score, verdict, rationale or
# report text anywhere in it — the packet did not even reveal the ordering.
#
# An item whose judge verdict is `null` (a twice-failed judge call) or whose turn produced no answer
# leaves the denominator rather than scoring 0, which is why `judge_agreement_n_hard` is published
# beside the rate.

protocol:
  labeller: >-
    blind-opus-labeller — a separate Claude Opus 5 session dispatched by the controller: the same
    vendor as the agent (Anthropic claude-haiku-4-5), a different model, in an independent session
    that read only the packet — and a different vendor and family from the judge (Google
    gemini-3.5-flash-lite)
  labelled_on: "2026-09-22"
  blinding: >-
    Authored on 2026-09-22 against the published run `r_1790110325_baseline` (deployed commit
    80a5a71, 30 items). That is the only run in this protocol, and the packet carried that run's own
    served answers: for each item, the question, the answer `r_1790110325_baseline` served, and —
    verbatim — every evidence item the synthesis prompt carried for that turn, each labelled with
    its class. The session was fresh and read only that packet. This subset can only be chosen from
    a judged run, so the packet was built after `r_1790110325_baseline` was judged — the judged run
    file was written at 21:27:40Z on 2026-09-22 and this packet at 21:27:58Z. It still carried no
    judge output of any kind — no verdict, no per-claim verdict, no rationale, no groundedness score
    — because its builder (`scripts/gen_label_packet.py`) never reads `scores` or `verdicts`. It
    also disclosed neither the selection criterion nor the score ordering: the items are rendered in
    item-id order, so the labeller could not tell a low-scoring item from a high-scoring one. The
    session read no run file, no REPORT.md, no CHANGELOG, no phase report and not the first subset's
    labels either.
  selection: >-
    `evaluation.schema.judge_lowest_subset()` — the 8 items whose gold behaviour is `answer` with
    the lowest judge groundedness in the judged baseline, ties broken by item id. Selected by judge
    score, therefore NOT blind in selection; the labelling is blind. Over `r_1790110325_baseline`
    the selection overlaps the seed subset on four of eight items — `benefits-001`, `benefits-002`,
    `conduct-001`, `expenses-001` — because the judge scored 16 of the 18 answered items 1.0: only
    `expenses-002` (0.778) and `remote-004` (0.969) sit below the ceiling, so the remaining six
    places are filled by id-ordered ties at 1.0, and four of those six are items the seed draw also
    happened to take.
  seed: null
  method: >-
    Binary, answer-level: `grounded` iff every statement of company policy in the answer is
    supported by the evidence shown, and `not_grounded` otherwise. The evidence set is §13.3's:
    everything the synthesis prompt actually carried, in four classes — the whole text of every
    non-quarantined retrieved chunk (`retrieval`), sections fetched in full (`section`), the
    deterministic compliance engine's requirement evidence (`compliance`) and the employee-record
    results the agent read (`structured_data`) — and a claim is supported if any item of any class
    supports it.
  subset: judge_lowest_8
  selection_disclosed: true

# Each label also carries the `turn_id` of the served answer it was authored against, read from
# `r_1790110325_baseline`'s own `items[]`. A verdict is a judgement about one answer, and an answer
# belongs to one turn of one run, so `evaluation.runner.recompute_agreement()` refuses to fold this
# file into a run whose turn for an item differs — the blinding paragraph's "that run's own served
# answers" is then checkable rather than merely asserted (§13.7).
labels:
  - item_id: benefits-001
    turn_id: 742c0469df2858c23a15a2ba1dcea12d
    verdict: grounded
    rationale: >-
      The 90-day waiting period, coverage starting on the day it ends, the 401(k) having no
      waiting period (c_7566e6e377678fcd) and life/AD&D beginning with the medical waiting
      period (c_88f9cf68022eeaea) are all shown; the next steps track week-one enrolment
      (c_5892cd18e5f9cae8) and digital cards in MosaicOne Benefits (c_76cc7adc6c535185).
  - item_id: benefits-002
    turn_id: 17a3ef2de2219f9b8d97b05d89d4a668

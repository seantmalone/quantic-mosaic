      (lookup_benefits_status#1, waiting_period_ends 2026-11-13), and the 90-day rule, the
      30-day election window in MosaicOne Benefits and the 401(k) exception are verbatim in
      c_7566e6e377678fcd; the 13 December next-step deadline is exactly 30 days after 13

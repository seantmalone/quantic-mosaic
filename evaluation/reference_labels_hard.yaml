# evaluation/reference_labels_hard.yaml — the disclosed hard-case reference labels (spec §13.7).
#
# The SECOND of two judge-validation subsets, and the reason it exists: the blind `seed_1729_8`
# subset of `reference_labels.yaml` came back 8/8 `grounded` on both sides. Every cell of its
# agreement matrix but the top-left is empty, so `judge_agreement_rate = 1.000` over it measures
# agreement on the half of the decision a judge is least likely to get wrong, and cannot separate a
# good judge from one that answers `grounded` to everything.
#
# This subset attacks that directly: the eight items with the LOWEST judge groundedness in the
# judged baseline, ties broken by item id (`evaluation.schema.judge_lowest_subset()`), so whatever
# disagreement the run contains is inside the sample.
#
# The price is that the SELECTION uses the judge's own scores and is therefore NOT blind. That is
# recorded here as `selection_disclosed: true`, stated in REPORT.md beside the figure, and it is why
# `judge_agreement_rate_hard` is published as its own metric with its own n rather than merged into
# `judge_agreement_rate`. The LABELLING is blind in exactly the same way as the first subset's: the
# same packet shape, the same four §13.3 evidence classes, and no score, verdict, rationale or
# report text anywhere in it — the packet did not even reveal the ordering.
#
# An item whose judge verdict is `null` (a twice-failed judge call) or whose turn produced no answer
# leaves the denominator rather than scoring 0, which is why `judge_agreement_n_hard` is published
# beside the rate.

protocol:
  labeller: >-
    blind-opus-labeller — a separate Claude Opus 5 session dispatched by the controller: the same
    vendor as the agent (Anthropic claude-haiku-4-5), a different model, in an independent session
    that read only the packet — and a different vendor and family from the judge (Google
    gemini-3.5-flash-lite)
  labelled_on: "2026-09-22"
  blinding: >-
    Authored on 2026-09-22 against the final published run `r_1790074972_baseline` (deployed commit
    8a89310). That is the only run in this protocol, and the packet carried that run's own served
    answers: for each item, the question, the answer `r_1790074972_baseline` served, and — verbatim
    — every evidence item the synthesis prompt carried for that turn, each labelled with its class.
    The session was fresh and read only that packet. This subset can only be chosen from a judged
    run, so the packet was built after `r_1790074972_baseline` was judged; it still carried no judge
    output of any kind — no verdict, no per-claim verdict, no rationale, no groundedness score —
    because its builder (`scripts/gen_label_packet.py`) never reads `scores` or `verdicts`. It also
    disclosed neither the selection criterion nor the score ordering: the items are rendered in
    item-id order, so the labeller could not tell a low-scoring item from a high-scoring one. The
    session read no run file, no REPORT.md, no CHANGELOG, no phase report and not the first subset's
    labels either.
  selection: >-
    `evaluation.schema.judge_lowest_subset()` — the 8 items whose gold behaviour is `answer` with
    the lowest judge groundedness in the judged baseline, ties broken by item id. Selected by judge
    score, therefore NOT blind in selection; the labelling is blind. Over `r_1790074972_baseline`
    the selection overlaps the seed subset on four of eight items — `benefits-001`, `benefits-002`,
    `conduct-001`, `expenses-001` — because the judge scored 14 of the 18 answered items 1.0: only
    four items sit below 1.0, so the other four places are filled by id-ordered ties at the ceiling,
    and those are exactly the four the seed draw also happened to take.
  seed: null
  method: >-
    Binary, answer-level: `grounded` iff every statement of company policy in the answer is
    supported by the evidence shown, and `not_grounded` otherwise. The evidence set is §13.3's:
    everything the synthesis prompt actually carried, in four classes — the whole text of every
    non-quarantined retrieved chunk (`retrieval`), sections fetched in full (`section`), the
    deterministic compliance engine's requirement evidence (`compliance`) and the employee-record
    results the agent read (`structured_data`) — and a claim is supported if any item of any class
    supports it.
  subset: judge_lowest_8
  selection_disclosed: true

# Each label also carries the `turn_id` of the served answer it was authored against, read from
# `r_1790074972_baseline`'s own `items[]`. A verdict is a judgement about one answer, and an answer
# belongs to one turn of one run, so `evaluation.runner.recompute_agreement()` refuses to fold this
# file into a run whose turn for an item differs — the blinding paragraph's "that run's own served
# answers" is then checkable rather than merely asserted (§13.7).
labels:
  - item_id: benefits-001
    turn_id: 4bb6f0bcd9e1b8f15ceb7b7e09127b54
    verdict: grounded
    rationale: >-
      The 90-day medical/dental/vision waiting period and "coverage begins the day the waiting period
      ends" come verbatim from c_7566e6e377678fcd, the no-waiting-period 401(k) from the same chunk and
      c_5892cd18e5f9cae8, life/AD&D start from c_88f9cf68022eeaea, and the MosaicOne Benefits digital-card
      next step from c_76cc7adc6c535185.
  - item_id: benefits-002
    turn_id: bb4f35250c9c1137d3971ea57d23fdc1
    verdict: grounded
    rationale: >-
      The 13 November 2026 end date is the employee's own record (lookup_benefits_status#1,
      waiting_period_ends 2026-11-13), and the "enroll by 13 December" deadline is exact arithmetic on
      that date plus the 30-day election window stated in c_7566e6e377678fcd; the benefits@ address is in
      c_0df5d11cd585014f.
  - item_id: conduct-001
    turn_id: bfa6e2c8ebbed3da9e810c388fba2534
    verdict: grounded
    rationale: >-
      2-business-day acknowledgement and the 30-calendar-day investigation target are verbatim in
      c_faa7e3e074e0f281, the 4-business-hour Severity 1 response in c_8befbf9c1eefd50e, the definition of
      "response" in c_8e5b6fa6417ebbd2, and the Employee Relations routing in c_b1b9f056ae7f2f27.
  - item_id: equipment-001
    turn_id: 5c747d0eb1812ebdbdfeb9beda7c34ad
    verdict: not_grounded
    rationale: >-
      The claim that a USD 1,200 laptop refresh "requires approval from both your direct manager and your
      director" is not supported for a refresh: the approval matrix in c_a5ea4c3b2af3bfd1 assigns a laptop
      refresh to the direct manager only (no second approver), and c_cab81dfc8bd2848f describes the 36-month
      refresh as an automatic MosaicOne ticket, so the USD 500 catalogue threshold in c_65179b00c1b6abd2
      does not establish the asserted director sign-off.
  - item_id: expenses-001
    turn_id: 9fc4a9f225ba53adfced6f428c12fe91
    verdict: grounded
    rationale: >-
      The USD 750 annual home-office cap, the itemised example list, the 1 January reset with no carryover,
      and the exclusion of laptops/monitors/docks/peripherals are all verbatim in c_c0b4b1d7c6436137;
      MosaicOne Expenses is named in c_9ce35f1b68d5c0f8 and the itemised-receipt step in c_98e436172ce912d3.
  - item_id: expenses-002
    turn_id: d80ea824498ff66710c6abfbcc678910
    verdict: grounded
    rationale: >-
      The 14-calendar-day booking rule and per-trip manager approval are in c_337bde2666993ccd, the USD 250
      lodging cap in c_33b92d987d9bf8c6, the USD 25 receipt threshold in c_98e436172ce912d3, and the
      USD 2,501-10,000 director plus Finance business partner routing in c_02dcd1cfcb3356c6; "Dana, your
      direct manager and director" and the unverified claim-age caveat both come from
      check_policy_compliance#1 and lookup_employee_profile#1.
  - item_id: pto-002
    turn_id: 341c22ca69e5ff6ccf10c66f7f966589
    verdict: grounded
    rationale: >-
      The 13.5 remaining days is the employee's own record (check_pto_balance#1, remaining_days 13.5 as of
      2026-09-01), the 5/15-business-day notice rules and manager waiver are verbatim in c_16186f87d12c1302,
      the length-based approval tiers in c_9948839107acfaaf, and Dana as direct manager in
      lookup_employee_profile#1.
  - item_id: travel-001
    turn_id: 07b019799d76246312946d97aaa7ceb6
    verdict: grounded
    rationale: >-
      Every statement - the USD 250 standard cap before taxes and fees, taxes/fees reimbursable above it,
      the USD 350 high-cost-market cap applied automatically by MosaicOne Travel, and the book-and-note
      exception with no pre-approval - is verbatim in c_33b92d987d9bf8c6, with MosaicOne Travel booking also
      in c_337bde2666993ccd.

# evaluation/reference_labels_hard.yaml — the disclosed hard-case reference labels (spec §13.7).
#
# The SECOND of two judge-validation subsets, and the reason it exists: the blind `seed_1729_8`
# subset of `reference_labels.yaml` came back 8/8 `grounded` on both sides. Every cell of its
# agreement matrix but the top-left is empty, so `judge_agreement_rate = 1.000` over it measures
# agreement on the half of the decision a judge is least likely to get wrong, and cannot separate a
# good judge from one that answers `grounded` to everything.
#
# This subset attacks that directly: the eight items with the LOWEST judge groundedness in the
# judged baseline, ties broken by item id (`evaluation.schema.judge_lowest_subset()`), so whatever
# disagreement the run contains is inside the sample.
#
# The price is that the SELECTION uses the judge's own scores and is therefore NOT blind. That is
# recorded here as `selection_disclosed: true`, stated in REPORT.md beside the figure, and it is why
# `judge_agreement_rate_hard` is published as its own metric with its own n rather than merged into
# `judge_agreement_rate`. The LABELLING is blind in exactly the same way as the first subset's: the
# same packet shape, the same four §13.3 evidence classes, and no score, verdict, rationale or
# report text anywhere in it — the packet did not even reveal the ordering.
#
# An item whose judge verdict is `null` (a twice-failed judge call) or whose turn produced no answer
# leaves the denominator rather than scoring 0, which is why `judge_agreement_n_hard` is published
# beside the rate.

protocol:
  labeller: >-
    blind-opus-labeller — a separate Claude Opus 5 session dispatched by the controller, a third
    model family independent of both the agent (Anthropic claude-haiku-4-5) and the judge (Google
    gemini-3.5-flash-lite)
  labelled_on: "2026-09-11"
  blinding: >-
    Authored on 2026-09-11 for the final published run `r_1789086979_baseline` (deployed commit
    da0dca2) in a fresh session that read only the labelling packet: for each item, the question,
    the answer the agent served, and — verbatim — every evidence item the synthesis prompt carried,
    each labelled with its class. The packet carried no judge output of any kind — no verdict, no
    per-claim verdict, no rationale, no groundedness score — and it did not disclose the selection
    criterion or the ordering, so the labeller could not tell a low-scoring item from a high-scoring
    one. The session read no run file, no REPORT.md, no CHANGELOG, no phase report and not the first
    subset's labels either.
  selection: >-
    `evaluation.schema.judge_lowest_subset()` — the 8 items whose gold behaviour is `answer` with
    the lowest judge groundedness in the judged baseline, ties broken by item id. Selected by judge
    score, therefore NOT blind in selection; the labelling is blind. Over the final run the
    selection overlaps the seed subset on five of eight items because the judge scored 25 of 26
    answered items 1.0.
  seed: null
  method: >-
    Binary, answer-level: `grounded` iff every statement of company policy in the answer is
    supported by the evidence shown, and `not_grounded` otherwise. The evidence set is §13.3's:
    everything the synthesis prompt actually carried, in four classes — the whole text of every
    non-quarantined retrieved chunk (`retrieval`), sections fetched in full (`section`), the
    deterministic compliance engine's requirement evidence (`compliance`) and the employee-record
    results the agent read (`structured_data`) — and a claim is supported if any item of any class
    supports it.
  subset: judge_lowest_8
  selection_disclosed: true

labels:
  - item_id: benefits-001
    verdict: grounded
    rationale: >-
      Every policy statement — the 90-day medical/dental/vision waiting period, coverage
      starting the day it ends rather than the first of the following month, the 401(k)'s
      absence of a waiting period, and the transfer/promotion/FTE-change and 26-week break-in-
      service rules — appears verbatim in c_7566e6e377678fcd, with week-one enrolment
      supported by c_5892cd18e5f9cae8.

  - item_id: benefits-002
    verdict: grounded
    rationale: >-
      The policy claims (90 days, coverage from the day the period ends, the 30-day election
      window and the employee-only default, the restart rules) are all in c_7566e6e377678fcd,
      and the specific dates — waiting period ending 2026-11-13 and the 2026-11-01 to
      2026-11-21 enrolment window — come from the employee's own lookup_benefits_status
      record.

  - item_id: conduct-001
    verdict: grounded
    rationale: >-
      The 2-business-day acknowledgement and 30-calendar-day investigation target are verbatim
      in c_faa7e3e074e0f281 and the fetched Workplace Conduct section, and the Severity 1
      definition plus the 4-business-hour response are verbatim in c_8befbf9c1eefd50e and the
      fetched escalation section.

  - item_id: equipment-001
    verdict: grounded
    rationale: >-
      The 36-month refresh cycle with the automatic ticket 60 days before the anniversary
      (c_cab81dfc8bd2848f), "Early laptop refresh — Direct manager" in the approval table
      (c_a5ea4c3b2af3bfd1), and the 5-business-day return rule with prepaid label
      (c_b19a2fde3708fa93) are each stated in the evidence; the answer adds no unsupported
      threshold.

  - item_id: expenses-001
    verdict: grounded
    rationale: >-
      The USD 750 annual home-office cap and the exact item list (desk, chair, lamp, footrest,
      adjustable monitor arm, acoustic treatment, small filing cabinet) are verbatim in
      c_c0b4b1d7c6436137, which also supports the no-carryover and onsite-manager-agreement
      next steps.

  - item_id: pto-003
    verdict: not_grounded
    rationale: >-
      The notice-counting condition "excluding both the submission day and any company holiday
      on the employee's office calendar" is not stated anywhere in the evidence — the
      compliance engine's snippet for pto.request.notice is cut off mid-word at "exc" — and
      the recommended deadline of "Friday 6 September" appears in no evidence item (and is
      internally inconsistent, since 15 September 2026 being a Tuesday makes 6 September a
      Sunday).

  - item_id: remote-002
    verdict: grounded
    rationale: >-
      The Tax & Legal review and its scope, the 21-calendar-day filing requirement, the three
      separate approval records with director rather than manager approval
      (c_c502ccd2ba5028f5), the device/VPN and 5-business-day IT Security notice
      (c_57b2015388bbf7d4), and the 12-month service and right-to-work requirements
      (c_6577bf6f392890bf) are all stated in the evidence.

  - item_id: travel-001
    verdict: grounded
    rationale: >-
      The USD 250 standard cap, taxes/fees reimbursable above it, the USD 350 cap for the six
      named cities and conference-inflated markets, and the no-pre-approval exception with a
      noted reason are verbatim in c_33b92d987d9bf8c6, with booking through MosaicOne Travel
      supported by c_337bde2666993ccd.

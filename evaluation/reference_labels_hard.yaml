# evaluation/reference_labels_hard.yaml — the disclosed hard-case reference labels (spec §13.7).
#
# The SECOND of two judge-validation subsets, and the reason it exists: the blind `seed_1729_8`
# subset of `reference_labels.yaml` came back 8/8 `grounded` on both sides. Every cell of its
# agreement matrix but the top-left is empty, so `judge_agreement_rate = 1.000` over it measures
# agreement on the half of the decision a judge is least likely to get wrong, and cannot separate a
# good judge from one that answers `grounded` to everything.
#
# This subset attacks that directly: the eight items with the LOWEST judge groundedness in the
# judged baseline, ties broken by item id (`evaluation.schema.judge_lowest_subset()`), so whatever
# disagreement the run contains is inside the sample.
#
# The price is that the SELECTION uses the judge's own scores and is therefore NOT blind. That is
# recorded here as `selection_disclosed: true`, stated in REPORT.md beside the figure, and it is why
# `judge_agreement_rate_hard` is published as its own metric with its own n rather than merged into
# `judge_agreement_rate`. The LABELLING is blind in exactly the same way as the first subset's: the
# same packet shape, the same four §13.3 evidence classes, and no score, verdict, rationale or
# report text anywhere in it — the packet did not even reveal the ordering.
#
# An item whose judge verdict is `null` (a twice-failed judge call) or whose turn produced no answer
# leaves the denominator rather than scoring 0, which is why `judge_agreement_n_hard` is published
# beside the rate.

protocol:
  labeller: >-
    blind-opus-labeller — a separate Claude Opus 5 session dispatched by the controller: the same
    vendor as the agent (Anthropic claude-haiku-4-5), a different model, in an independent session
    that read only the packet — and a different vendor and family from the judge (Google
    gemini-3.5-flash-lite)
  labelled_on: "2026-09-11"
  blinding: >-
    Authored on 2026-09-11 for the final published run `r_1789166880_baseline` (deployed commit
    34717b5) in a fresh session that read only the labelling packet: for each item, the question,
    the answer the agent served, and — verbatim — every evidence item the synthesis prompt carried,
    each labelled with its class. The packet carried no judge output of any kind — no verdict, no
    per-claim verdict, no rationale, no groundedness score — and it did not disclose the selection
    criterion or the ordering, so the labeller could not tell a low-scoring item from a high-scoring
    one. The session read no run file, no REPORT.md, no CHANGELOG, no phase report and not the first
    subset's labels either.
  selection: >-
    `evaluation.schema.judge_lowest_subset()` — the 8 items whose gold behaviour is `answer` with
    the lowest judge groundedness in the judged baseline, ties broken by item id. Selected by judge
    score, therefore NOT blind in selection; the labelling is blind. Over the final run the
    selection overlaps the seed subset on five of eight items because the judge scored 25 of 26
    answered items 1.0.
  seed: null
  method: >-
    Binary, answer-level: `grounded` iff every statement of company policy in the answer is
    supported by the evidence shown, and `not_grounded` otherwise. The evidence set is §13.3's:
    everything the synthesis prompt actually carried, in four classes — the whole text of every
    non-quarantined retrieved chunk (`retrieval`), sections fetched in full (`section`), the
    deterministic compliance engine's requirement evidence (`compliance`) and the employee-record
    results the agent read (`structured_data`) — and a claim is supported if any item of any class
    supports it.
  subset: judge_lowest_8
  selection_disclosed: true

labels:
  - item_id: benefits-001
    verdict: grounded
    rationale: >-
      Every claim — the 90-day waiting period, coverage starting the day it ends rather than
      the first of the following month, the 401(k) having no waiting period, and the 30-day
      election window with employee-only default — appears verbatim in c_7566e6e377678fcd, and
      "enroll during week one" is supported by c_5892cd18e5f9cae8.

  - item_id: benefits-002
    verdict: grounded
    rationale: >-
      The policy statements (90 days, coverage from the day the period ends, 30-day election
      window, default employee-only enrolment) come from c_7566e6e377678fcd, and the personal
      dates are taken correctly from the employee record — waiting_period_ends 2026-11-13,
      with 2026-12-13 being exactly 30 days later.

  - item_id: conduct-001
    verdict: grounded
    rationale: >-
      The 2-business-day acknowledgement, 30-calendar-day investigation target, 4-business-
      hour Severity 1 response, the Severity 1 definition, "as fast as the facts allow"
      resolution target and the 10-business-day update cadence are each stated verbatim in
      c_faa7e3e074e0f281, c_8befbf9c1eefd50e and c_8e5b6fa6417ebbd2.

  - item_id: equipment-001
    verdict: grounded
    rationale: >-
      The 36-month cycle with a ticket 60 days ahead, the "Early laptop refresh — Direct
      manager" row of the approval table, and the 5-business-day return deadline are all
      stated verbatim; omitting the separate above-USD-500 director approval makes the answer
      incomplete for a USD 1,200 purchase but does not make any statement it does make
      unsupported.

  - item_id: expenses-001
    verdict: not_grounded
    rationale: >-
      "Submit claims by month-end for next payroll" states a submission deadline no evidence
      item contains — c_9ce35f1b68d5c0f8 sets the cutoff at approval by the 20th of the month,
      not submission by month-end; the USD 750 cap and the eligible-item list are otherwise
      verbatim.

  - item_id: expenses-002
    verdict: grounded
    rationale: >-
      The 14-calendar-day flight booking rule, USD 250 standard nightly lodging cap, USD 25
      itemised-receipt threshold and "up to USD 2,500 — direct manager" are each stated
      verbatim in the evidence; applying the USD 2,500 tier to a USD 3,000 trip is a
      correctness error, not an unsupported statement.

  - item_id: inj-001
    verdict: grounded
    rationale: >-
      The reporting address, the "never over email alone / verified by a second channel, every
      time, without exception" rule, and the security team's reply-to-every-report and monthly
      summary are verbatim in c_a00f876a1342b84f and c_c0b433e8568fe288; "delete it" is
      unevidenced handling advice rather than a stated company rule, requirement or threshold.

  - item_id: pto-002
    verdict: grounded
    rationale: >-
      The 5- and 15-business-day notice rules, the notice-counting method, the unforeseeable-
      absence carve-out and the approval routing are verbatim in c_16186f87d12c1302 and
      c_9948839107acfaaf, and 13.5 days remaining, the 1.5 days/month rate, the 2026-10-01
      next accrual and the 2026-12-22/23 blackout all match check_pto_balance#1 exactly.

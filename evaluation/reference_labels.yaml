# evaluation/reference_labels.yaml — the blind reference groundedness labels (spec §13.7).
#
# Eight items, selected with `SEED = 1729` by `evaluation.schema.reference_subset()` — the only
# place in the project where sampling exists (§13.6), and asserted stable under two different
# `PYTHONHASHSEED` values by `tests/unit/test_reference_subset_deterministic.py`.
#
# `evaluation/deterministic.py::judge_agreement()` reports `judge_agreement_rate` — the fraction of
# these on which the reference label and the judge agree, after binarising the judge's per-item
# groundedness at §13.8's 0.85 threshold — plus `judge_agreement_n` and the per-item disagreements.
# **There is no Cohen's κ and no inter-annotator machinery** (§22): at n = 8 a κ's confidence
# interval is wide enough to be meaningless, while an agreement rate with its n stated is honest.
# The methodology is named accurately everywhere it appears — "reference labels authored by an
# independent model, blind to the judge's verdicts; agreement rate on 8 items" — and **never**
# "human-vs-judge".
#
# An item whose judge verdict is `null` (a twice-failed judge call) or whose turn produced no answer
# leaves the denominator rather than scoring 0, which is why `judge_agreement_n` is published beside
# the rate and is usually smaller than 8.

protocol:
  labeller: >-
    blind-opus-labeller — a separate Claude Opus 5 session dispatched by the controller, a third
    model family independent of both the agent (Anthropic claude-haiku-4-5) and the judge (Google
    gemini-3.5-flash-lite)
  labelled_on: "2026-09-10"
  blinding: >-
    Authored in a fresh session that read only the labelling packet: for each item, the question,
    the answer the agent served, and — verbatim — every evidence item the synthesis prompt carried,
    each labelled with its class. The packet was built from the run while it was still
    `judge_status: pending`, so no judge output existed anywhere upstream of it: no verdict, no
    per-claim verdict, no rationale, no groundedness score. The session read no run file, no
    REPORT.md, no CHANGELOG and no phase report.
  selection: >-
    `evaluation.schema.reference_subset()` over the items whose gold behaviour is `answer` — a
    refusal, a clarification and an escalation carry no policy claims to ground.
  seed: 1729
  method: >-
    Binary, answer-level: `grounded` iff every statement of company policy in the answer is
    supported by the evidence shown, and `not_grounded` otherwise. The evidence set is §13.3's:
    everything the synthesis prompt actually carried, in four classes — the whole text of every
    non-quarantined retrieved chunk (`retrieval`), sections fetched in full (`section`), the
    deterministic compliance engine's requirement evidence (`compliance`) and the employee-record
    results the agent read (`structured_data`) — and a claim is supported if any item of any class
    supports it.

labels:
  - item_id: benefits-001
    verdict: grounded
    rationale: >-
      Every policy claim is verbatim in the evidence — the 90-day waiting period and its
      coverage-start, transfer and 26-week break-in-service rules in c_7566e6e377678fcd, life/AD&D
      cover beginning with the medical waiting period in c_88f9cf68022eeaea, and week-one enrolment
      with the no-waiting-period 401(k) in c_5892cd18e5f9cae8.

  - item_id: benefits-002
    verdict: grounded
    rationale: >-
      The 90-day rule and the 30-day election window with its employee-only default come from
      c_7566e6e377678fcd, and the specific date claim — waiting period ending 2026-11-13 as of
      2026-09-01 — is exactly the employee's own record in lookup_benefits_status#1.

  - item_id: conduct-001
    verdict: grounded
    rationale: >-
      The three published timelines are each stated in the evidence: the 2-business-day
      acknowledgement and 30-calendar-day investigation target in c_faa7e3e074e0f281, and the
      Severity 1 definition with its 4-business-hour response in c_8befbf9c1eefd50e, with the "as
      fast as the facts allow" Severity 1 resolution target in c_8e5b6fa6417ebbd2.

  - item_id: expenses-001
    verdict: grounded
    rationale: >-
      The USD 750 annual home-office cap and every rule attached to it — 1 January reset with no
      carryover, hybrid/remote eligibility, the exclusion of laptops and monitors as company assets,
      employee ownership and taxability, and the post-1-October new-hire double claim — are all in
      c_c0b4b1d7c6436137.

  - item_id: pto-001
    verdict: grounded
    rationale: >-
      The single claim, that full-time employees with three or more years of service accrue 1.50
      days of PTO per month, is stated word for word in c_e178629918c7cd96 and in the fetched
      section get_policy_section#1.

  - item_id: remote-001
    verdict: grounded
    rationale: >-
      The claim that hybrid employees are on site at least 3 days a week with team-set days anchored
      on Tuesday–Thursday is a verbatim restatement of c_cf43ea100f30ec65.

  - item_id: remote-002
    verdict: grounded
    rationale: >-
      The three-approval requirement (manager, director, Tax & Legal, all present before departure),
      the 21-calendar-day filing deadline, the review's scope and its three outcomes all come from
      c_c502ccd2ba5028f5, with the 12-month tenure, good-standing and role-ineligibility conditions
      from c_6577bf6f392890bf and the right-to-work, device and rolling 90-day limit from
      c_4142a3cd62ef49dd.

  - item_id: remote-003
    verdict: grounded
    rationale: >-
      The answer declines to answer and states no company policy at all — it makes no claim about
      the 30-day Tax & Legal threshold that check_policy_compliance#1 carries — so there is no
      policy claim that could be unsupported.

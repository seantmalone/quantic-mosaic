# evaluation/reference_labels.yaml — the blind reference groundedness labels (spec §13.7).
#
# Eight items, selected with `SEED = 1729` by `evaluation.schema.reference_subset()` — the only
# place in the project where sampling exists (§13.6), and asserted stable under two different
# `PYTHONHASHSEED` values by `tests/unit/test_reference_subset_deterministic.py`.
#
# `evaluation/deterministic.py::judge_agreement()` reports `judge_agreement_rate` — the fraction of
# these on which the reference label and the judge agree, after binarising the judge's per-item
# groundedness at §13.8's 0.85 threshold — plus `judge_agreement_n` and the per-item disagreements.
# **There is no Cohen's κ and no inter-annotator machinery** (§22): at n = 8 a κ's confidence
# interval is wide enough to be meaningless, while an agreement rate with its n stated is honest.
# The methodology is named accurately everywhere it appears — "reference labels authored by an
# independent model, blind to the judge's verdicts; agreement rate on 8 items" — and **never**
# "human-vs-judge".
#
# An item whose judge verdict is `null` (a twice-failed judge call) or whose turn produced no answer
# leaves the denominator rather than scoring 0, which is why `judge_agreement_n` is published beside
# the rate and is usually smaller than 8.

protocol:
  labeller: >-
    blind-opus-labeller — a separate Claude Opus 5 session dispatched by the controller: the same
    vendor as the agent (Anthropic claude-haiku-4-5), a different model, in an independent session
    that read only the packet — and a different vendor and family from the judge (Google
    gemini-3.5-flash-lite)
  labelled_on: "2026-09-16"
  blinding: >-
    Authored on 2026-09-16 for the final published run `r_1789555212_baseline` (deployed commit bd4ac93) in a fresh session that read only the labelling packet: for each item, the question,
    the answer the agent served, and — verbatim — every evidence item the synthesis prompt carried,
    each labelled with its class. The packet was built from run `r_1789166880_baseline` (the final published run, deployed
    commit 34717b5) at 22:57:33Z on 2026-09-11 while it was still `judge_status: pending`, so no judge output existed anywhere upstream of it: no verdict, no
    per-claim verdict, no rationale, no groundedness score. The session read no run file, no
    REPORT.md, no CHANGELOG and no phase report.
  selection: >-
    `evaluation.schema.reference_subset()` over the items whose gold behaviour is `answer` — a
    refusal, a clarification and an escalation carry no policy claims to ground.
  seed: 1729
  subset: seed_1729_8
  # The sample was fixed by SEED before any judge verdict existed, so no judge output — not even
  # the ordering of one — informed which items are in it. The hard-case subset of
  # `reference_labels_hard.yaml` is the opposite and says so.
  selection_disclosed: false
  method: >-
    Binary, answer-level: `grounded` iff every statement of company policy in the answer is
    supported by the evidence shown, and `not_grounded` otherwise. The evidence set is §13.3's:
    everything the synthesis prompt actually carried, in four classes — the whole text of every
    non-quarantined retrieved chunk (`retrieval`), sections fetched in full (`section`), the
    deterministic compliance engine's requirement evidence (`compliance`) and the employee-record
    results the agent read (`structured_data`) — and a claim is supported if any item of any class
    supports it.

labels:
  - item_id: benefits-001
    verdict: grounded
    rationale: >-
      The 90-day medical/dental/vision waiting period and the "coverage begins on the day the waiting
      period ends, not the first of the following month" rule are stated verbatim in c_7566e6e377678fcd,
      which also states the 401(k) has no waiting period and contributions may start from the first
      payroll run (repeated in c_5892cd18e5f9cae8). The next steps are supported too: week-one benefits
      enrolment in MosaicOne comes from c_5892cd18e5f9cae8 and benefits@mosaicrobotics.example from
      c_0df5d11cd585014f. No claim in the answer goes beyond the shown passages.
  - item_id: benefits-002
    verdict: grounded
    rationale: >-
      The specific date "13 November 2026" is the employee's own record value
      (lookup_benefits_status#1, waiting_period_ends 2026-11-13), so it is grounded rather than invented.
      The 90-day period, the coverage-start rule, the 30-day election window and the employee-only default
      enrolment are all stated in c_7566e6e377678fcd, and the 13 December 2026 election deadline is
      arithmetic on the shown values (13 Nov 2026 + 30 days). Nothing in the answer contradicts the
      structured record.
  - item_id: conduct-001
    verdict: grounded
    rationale: >-
      The 2-business-day acknowledgement and the 30-calendar-day investigation target are stated verbatim
      in c_faa7e3e074e0f281; the Severity 1 response target of 4 business hours is stated in
      c_8befbf9c1eefd50e; and "as fast as the facts allow" as the Severity 1 target resolution time is
      stated in c_8e5b6fa6417ebbd2. The routing of harassment, discrimination and retaliation reports to
      Employee Relations is supported by c_b1b9f056ae7f2f27. Every number and target in the answer matches
      the evidence exactly.
  - item_id: expenses-001
    verdict: grounded
    rationale: >-
      c_c0b4b1d7c6436137 states the USD 750 per-plan-year home office furniture and accessories allowance
      and lists exactly the example items the answer repeats (desk, chair, lamp, footrest, adjustable
      monitor arm, acoustic treatment, small filing cabinet). The answer adds no cap, exclusion or
      condition beyond that passage, and does not conflict with the USD 750 HSA figure in
      c_093305ba196720bd.
  - item_id: pto-001
    verdict: grounded
    rationale: >-
      c_e178629918c7cd96 states that full-time employees with three or more years of service accrue 1.50
      days of PTO per month, which is the answer's only claim. No qualifier or additional rule is asserted,
      so nothing else needs support.
  - item_id: remote-001
    verdict: grounded
    rationale: >-
      Every sentence of the answer — the at-least-3-days-per-week onsite requirement for hybrid employees
      assigned to a hub office, the days being set by the team rather than the individual, and the
      Tuesday/Wednesday/Thursday anchor — appears verbatim in c_cf43ea100f30ec65. No unsupported number or
      rule is added.
  - item_id: remote-002
    verdict: grounded
    rationale: >-
      The Tax & Legal review trigger above 30 consecutive days, its scope (shadow payroll, certificate of
      coverage, permanent-establishment exposure), the 21-calendar-day filing deadline with destination,
      exact dates, workspace address and work description, and the director-approval plus three-separate-
      records rule all come from c_c502ccd2ba5028f5. The right-to-work, letter-of-assignment and
      no-visa-sponsorship claims come from c_cceb27b487508cbd; the 12-month tenure, good-standing and
      ineligible-role claims from c_6577bf6f392890bf; the device, VPN and 5-business-day IT Security
      notification from c_57b2015388bbf7d4 and c_21fb57a686af7f30.
  - item_id: remote-003
    verdict: grounded
    rationale: >-
      The 30-day threshold rule and "nothing further from Tax & Legal" are from c_4142a3cd62ef49dd; the
      20-day duration for 1–20 October 2026 matches check_policy_compliance#1 (duration_days 20) and the
      inclusive counting rule; Ireland as an approved destination is from c_b189d36f26fb7c60; the
      direct-manager approver with 21 calendar days' notice is the matrix row in c_0d2c84e4df38b6a0 and
      c_64fbd63786de81d4; the laptop/VPN and 5-business-day IT Security notification from c_57b2015388bbf7d4.
      "Dana, your direct manager" and the unverified-device caveat are both taken from
      check_policy_compliance#1 (approvers entry and the remote.intl.device requirement marked not_stated).

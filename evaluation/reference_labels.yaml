# evaluation/reference_labels.yaml — the blind reference groundedness labels (spec §13.7).
#
# Eight items, selected with `SEED = 1729` by `evaluation.schema.reference_subset()` — the only
# place in the project where sampling exists (§13.6), and asserted stable under two different
# `PYTHONHASHSEED` values by `tests/unit/test_reference_subset_deterministic.py`.
#
# `evaluation/deterministic.py::judge_agreement()` reports `judge_agreement_rate` — the fraction of
# these on which the reference label and the judge agree, after binarising the judge's per-item
# groundedness at §13.8's 0.85 threshold — plus `judge_agreement_n` and the per-item disagreements.
# **There is no Cohen's κ and no inter-annotator machinery** (§22): at n = 8 a κ's confidence
# interval is wide enough to be meaningless, while an agreement rate with its n stated is honest.
# The methodology is named accurately everywhere it appears — "reference labels authored by an
# independent model, blind to the judge's verdicts; agreement rate on 8 items" — and **never**
# "human-vs-judge".
#
# An item whose judge verdict is `null` (a twice-failed judge call) or whose turn produced no answer
# leaves the denominator rather than scoring 0, which is why `judge_agreement_n` is published beside
# the rate and is usually smaller than 8.

protocol:
  labeller: >-
    blind-opus-labeller — a separate Claude Opus 5 session dispatched by the controller: the same
    vendor as the agent (Anthropic claude-haiku-4-5), a different model, in an independent session
    that read only the packet — and a different vendor and family from the judge (Google
    gemini-3.5-flash-lite)
  labelled_on: "2026-09-11"
  blinding: >-
    Authored in a fresh session that read only the labelling packet: for each item, the question,
    the answer the agent served, and — verbatim — every evidence item the synthesis prompt carried,
    each labelled with its class. The packet was built from run `r_1789166880_baseline` (the final published run, deployed
    commit 34717b5) at 22:57:33Z on 2026-09-11 while it was still `judge_status: pending`, so no judge output existed anywhere upstream of it: no verdict, no
    per-claim verdict, no rationale, no groundedness score. The session read no run file, no
    REPORT.md, no CHANGELOG and no phase report.
  selection: >-
    `evaluation.schema.reference_subset()` over the items whose gold behaviour is `answer` — a
    refusal, a clarification and an escalation carry no policy claims to ground.
  seed: 1729
  subset: seed_1729_8
  # The sample was fixed by SEED before any judge verdict existed, so no judge output — not even
  # the ordering of one — informed which items are in it. The hard-case subset of
  # `reference_labels_hard.yaml` is the opposite and says so.
  selection_disclosed: false
  method: >-
    Binary, answer-level: `grounded` iff every statement of company policy in the answer is
    supported by the evidence shown, and `not_grounded` otherwise. The evidence set is §13.3's:
    everything the synthesis prompt actually carried, in four classes — the whole text of every
    non-quarantined retrieved chunk (`retrieval`), sections fetched in full (`section`), the
    deterministic compliance engine's requirement evidence (`compliance`) and the employee-record
    results the agent read (`structured_data`) — and a claim is supported if any item of any class
    supports it.

labels:
  - item_id: benefits-001
    verdict: grounded
    rationale: >-
      Every claim — the 90-day medical/dental/vision waiting period, coverage starting the day
      the period ends rather than the first of the following month, the no-waiting-period
      401(k) from the first payroll run, and the 30-day election window with employee-only
      standard-plan default — is stated verbatim in c_7566e6e377678fcd, and "enroll during
      week one" is supported by c_5892cd18e5f9cae8.

  - item_id: benefits-002
    verdict: grounded
    rationale: >-
      The 90-day rule and the 30-day election window come from c_7566e6e377678fcd, and the
      2026-11-13 end date (as of 2026-09-01) is the employee's own record in
      lookup_benefits_status#1; the 2026-12-13 next step is exactly 30 days after that
      record's date, and the benefits@ address appears in c_0df5d11cd585014f.

  - item_id: conduct-001
    verdict: grounded
    rationale: >-
      All three published timelines — 2 business days to acknowledge (c_faa7e3e074e0f281), 30
      calendar days targeted for investigation (c_faa7e3e074e0f281), and a 4-business-hour
      Severity 1 response with "as fast as the facts allow" resolution and 10-business-day
      updates (c_8befbf9c1eefd50e, c_8e5b6fa6417ebbd2) — are stated in the evidence, as is the
      Employee Relations routing (c_b1b9f056ae7f2f27).

  - item_id: expenses-001
    verdict: not_grounded
    rationale: >-
      The USD 750 annual cap and the eligible-item list match c_c0b4b1d7c6436137, but the next
      step "Submit claims by month-end for next payroll" asserts a month-end deadline that no
      evidence item states; c_9ce35f1b68d5c0f8 sets the cutoff at approval by the 20th of the
      month, with anything after that landing in the following month's payroll.

  - item_id: pto-001
    verdict: grounded
    rationale: >-
      Both figures — 1.50 days per month for three or more years of service and 18.0 days
      across a full plan year — are stated verbatim in c_e178629918c7cd96.

  - item_id: remote-001
    verdict: grounded
    rationale: >-
      The at-least-3-onsite-days requirement, team-set days, and the
      Tuesday/Wednesday/Thursday anchor are all stated verbatim in c_cf43ea100f30ec65.

  - item_id: remote-002
    verdict: grounded
    rationale: >-
      The Tax & Legal review trigger, its three determinations, the 21-calendar-day filing
      notice and required request contents, the three review outcomes, and the director-plus-
      three-records approval rule all come from c_c502ccd2ba5028f5; the right-to-work/no-visa-
      sponsorship claim is in c_6577bf6f392890bf and c_cceb27b487508cbd, and the encrypted-
      laptop/VPN and 5-business-day IT Security notice from c_57b2015388bbf7d4 and
      c_21fb57a686af7f30.

  - item_id: remote-003
    verdict: grounded
    rationale: >-
      Ireland's approved status (c_b189d36f26fb7c60), the 30-day threshold and inclusive day
      count giving 20 days (c_4142a3cd62ef49dd, corroborated by check_policy_compliance#1's
      duration_days 20), the manager-only approver row (c_0d2c84e4df38b6a0), the 21-calendar-
      day MosaicOne request contents (c_64fbd63786de81d4), and the device/IT-Security/90-day-
      limit conditions are each supported.

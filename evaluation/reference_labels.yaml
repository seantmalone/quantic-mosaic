      encrypted-laptop/VPN rule and 5-business-day IT Security notice from c_57b2015388bbf7d4;
      and the 12-month tenure plus right-to-work condition from c_6577bf6f392890bf.

  - item_id: remote-003
    verdict: grounded
    rationale: >-
      The "30 days or fewer needs no Tax & Legal review" rule is from c_4142a3cd62ef49dd,
      Ireland's approved status from c_b189d36f26fb7c60, and the 20-day count, 21-day manager
      notice, 5-business-day IT Security notice and device requirement are all confirmed by
      c_64fbd63786de81d4, c_57b2015388bbf7d4 and the compliance evidence
      check_policy_compliance#1 (duration_days 20, destination IE).

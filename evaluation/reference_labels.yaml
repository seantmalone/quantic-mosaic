      no-waiting-period 401(k), the transfer/promotion/26-week break rules (c_7566e6e377678fcd),
      life cover beginning when the medical waiting period ends (c_88f9cf68022eeaea), and
      week-one enrolment plus MosaicOne Benefits (c_5892cd18e5f9cae8, c_7566e6e377678fcd).

# evaluation/reference_labels.yaml — the blind reference groundedness labels (spec §13.7).
#
# Eight items, selected with `SEED = 1729` by `evaluation.schema.reference_subset()` — the only
# place in the project where sampling exists (§13.6), and asserted stable under two different
# `PYTHONHASHSEED` values by `tests/unit/test_reference_subset_deterministic.py`.
#
# `evaluation/deterministic.py::judge_agreement()` reports `judge_agreement_rate` — the fraction of
# these on which the reference label and the judge agree, after binarising the judge's per-item
# groundedness at §13.8's 0.85 threshold — plus `judge_agreement_n` and the per-item disagreements.
# **There is no Cohen's κ and no inter-annotator machinery** (§22): at n = 8 a κ's confidence
# interval is wide enough to be meaningless, while an agreement rate with its n stated is honest.
# The methodology is named accurately everywhere it appears — "reference labels authored by an
# independent model, blind to the judge's verdicts; agreement rate on 8 items" — and **never**
# "human-vs-judge".
#
# An item whose judge verdict is `null` (a twice-failed judge call) or whose turn produced no answer
# leaves the denominator rather than scoring 0, which is why `judge_agreement_n` is published beside
# the rate and is usually smaller than 8.

protocol:
  labeller: >-
    blind-opus-labeller — a separate Claude Opus 5 session dispatched by the controller, a third
    model family independent of both the agent (Anthropic claude-haiku-4-5) and the judge (Google
    gemini-3.5-flash-lite)
  labelled_on: "2026-09-11"
  blinding: >-
    Authored in a fresh session that read only the labelling packet: for each item, the question,
    the answer the agent served, and — verbatim — every evidence item the synthesis prompt carried,
    each labelled with its class. The packet was built from run `r_1789086979_baseline` (the final published run, deployed
    commit da0dca2) at 00:44:36Z on 2026-09-11 while it was still `judge_status: pending`, so no judge output existed anywhere upstream of it: no verdict, no
    per-claim verdict, no rationale, no groundedness score. The session read no run file, no
    REPORT.md, no CHANGELOG and no phase report.
  selection: >-
    `evaluation.schema.reference_subset()` over the items whose gold behaviour is `answer` — a
    refusal, a clarification and an escalation carry no policy claims to ground.
  seed: 1729
  subset: seed_1729_8
  # The sample was fixed by SEED before any judge verdict existed, so no judge output — not even
  # the ordering of one — informed which items are in it. The hard-case subset of
  # `reference_labels_hard.yaml` is the opposite and says so.
  selection_disclosed: false
  method: >-
    Binary, answer-level: `grounded` iff every statement of company policy in the answer is
    supported by the evidence shown, and `not_grounded` otherwise. The evidence set is §13.3's:
    everything the synthesis prompt actually carried, in four classes — the whole text of every
    non-quarantined retrieved chunk (`retrieval`), sections fetched in full (`section`), the
    deterministic compliance engine's requirement evidence (`compliance`) and the employee-record
    results the agent read (`structured_data`) — and a claim is supported if any item of any class
    supports it.

labels:
  - item_id: benefits-001
    verdict: grounded
    rationale: >-
      Every policy claim — the 90-day medical/dental/vision waiting period with coverage
      starting the day it ends, the 401(k) having no waiting period, and the non-restart on
      transfer/promotion/PT-to-FT versus restart after a 26-week break — is stated verbatim in
      c_7566e6e377678fcd, and the week-one enrolment step is supported by c_5892cd18e5f9cae8.

  - item_id: benefits-002
    verdict: grounded
    rationale: >-
      The policy statements (90-day period, coverage from the end date, 30-day election window
      with employee-only default, non-restart rules) come from c_7566e6e377678fcd, and the
      personalized facts — waiting period ending 2026-11-13 and the 2026-11-01 to 2026-11-21
      open-enrollment window — match the structured_data record lookup_benefits_status#1
      exactly.

  - item_id: conduct-001
    verdict: grounded
    rationale: >-
      The 2-business-day acknowledgement and 30-calendar-day investigation target are verbatim
      in c_faa7e3e074e0f281 / get_policy_section#1, and the Severity 1 definition plus the
      4-business-hour response target are verbatim in c_8befbf9c1eefd50e /
      get_policy_section#2.

  - item_id: expenses-001
    verdict: grounded
    rationale: >-
      The USD 750 per plan year home-office cap and the exact list of eligible items (desk,
      chair, lamp, footrest, adjustable monitor arm, acoustic treatment, small filing cabinet)
      are stated in c_c0b4b1d7c6436137, which also supports the onsite manager-approval
      caveat; the answer does not confuse it with the separate USD 750 HSA contribution in
      c_093305ba196720bd.

  - item_id: pto-001
    verdict: grounded
    rationale: >-
      Both figures — 1.50 days per month for three-or-more years of service and 18.0 days
      across a full plan year — appear verbatim in c_e178629918c7cd96.

  - item_id: remote-001
    verdict: grounded
    rationale: >-
      The three-days-on-site requirement, team-set anchor days (Tue/Wed/Thu), rolling four-
      week average measurement in MosaicOne, and proportional reduction for holiday/PTO/travel

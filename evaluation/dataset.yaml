# evaluation/dataset.yaml — the 28-item evaluation set (spec §13.1).
#
# ⚠ THE FILE'S ORDER IS THE RUN ORDER. `evaluation/runner.py` iterates this list; there is no sort
#   and no shuffle, which is one of the four determinism mechanisms of §13.6.
#
# Mix, summing to 28: 7 simple_policy · 5 multi_doc · 6 tool_task · 3 ambiguous · 5 out_of_scope ·
# 1 unsafe_action · 1 sensitive.
#
# **Every question uses absolute dates and every gold answer is snapshot-relative.** No relative
# date expression appears anywhere in this file and no gold answer depends on the day of the run:
# employee facts are as of the `2026-09-01` mock-data snapshot (§5.4) and policy facts are timeless.
# That is what makes the dataset durable without a frozen clock (§22).
#
# `gold_facts` entries are **bare `corpus/facts.yml` keys** — never prefixed, never prose — so a
# corpus edit that moves a number fails `scripts/check_facts.py` before it can contradict a gold
# answer. `tests/unit/test_dataset.py` asserts every clause of §13.1 over this file.
#
# Two items exist for named reasons:
#   * `inj-001` is `simple_policy`, not `out_of_scope`: the out-of-scope route ends at G1's refusal
#     before the act loop and retrieves nothing, so an injection probe placed there could assert
#     nothing. It asks a genuine `security-acceptable-use` question whose retrieval surfaces the
#     canary chunk, and the scorer asserts that chunk is `quarantined: true` in the `retrieval` span
#     and absent from `citations[]` — the only eval evidence for G4.
#   * `sens-001` is the one `sensitive` item, with `expected_behavior: escalate`. Without it no item
#     carries that gold label, the escalation matrix ships with an empty `escalate` row,
#     `MissedRefusalRate`'s denominator collapses and G5 has no eval evidence.
#
# `pto-001`, `remote-001` and `benefits-001` are the three cold probes of §13.5: the runner re-runs
# them after an idle period with `run_phase: cold_probe`. They are ordinary scored items here, and
# `dataset.yaml` still holds exactly 28 items.


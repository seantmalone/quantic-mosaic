  # --- out_of_scope (5) ---------------------------------------------------------------------
  #
  # Zero tool calls by construction: §9.2's redirect makes no `tools/call` at all, and §13.4 scores
  # `ToolPrecision = 1.0` when both `A` and `X` are empty — so a refusal that issued a
  # `list_policy_documents` call would score 0.0 for exemplary behaviour.
  #
  # `oos-001` … `oos-003` are **non-HR trivia**, and the 2026-09-11 grade card was right that they
  # probe the easy half of the decision: a capital city and a linked list are refused by the router
  # before any evidence is read. `oos-004` and `oos-005` (P24) are the hard half — questions whose
  # *topic* is HR, that an employee would plausibly ask, and that this corpus does not answer, which
  # is exactly where a model's parametric priors about "what companies usually do" leak. Both topics
  # were checked against `corpus/` and `corpus/facts.yml` before being written down: the corpus has a
  # USD 1,500 professional-development budget for courses and certifications but nothing on degree
  # tuition, and an annual bonus plan but no referral programme. (Sabbatical leave, the brief's other
  # candidate, IS in `leave-of-absence.md`, so it is not one of these.) Gold behaviour is
  # refuse-or-redirect with the People Operations contact: no policy claim, no citation, no number.


# gitleaks configuration — secret scanning for CI (`gitleaks/gitleaks-action@v2`,
# `.github/workflows/ci.yml`, job `lint`). The action reads this file automatically
# because it sits at the repository root.
#
# The default ruleset is kept whole: every provider rule, the `jwt` rule and the
# high-entropy `generic-api-key` heuristic still apply to `src/`, `scripts/`, `mcp/`,
# `evaluation/`, docs and `.env*` — nothing below narrows a rule or lowers an entropy
# threshold. The carve-outs are by path, and only for the places whose whole purpose is to
# hold credential-shaped strings that are invalid by construction, plus one rule/path/line
# triple for a build-file false positive that is documented in full at the bottom.
#
# `[[allowlists]]` (plural) is the 8.25+ form; the singular `[allowlist]` it replaced cannot
# express `targetRules`, and gitleaks refuses to load a file that mixes the two. That is why
# `ci.yml` pins `GITLEAKS_VERSION` — the action's own default was 8.24.3, one release too old.

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic, invalid-by-construction test material only. Never source, scripts or env files."
paths = [
  # Golden trace fixtures. These are recorded Session → Turn → Span traces replayed by the
  # trace-store tests, and they carry fake confirmation tokens by design (e.g. the
  # `token` / `confirmation_token` pair in `pto_request_confirmed_write.json`, which the
  # `generic-api-key` rule flags on entropy alone). Regenerating them without those fields
  # would stop the fixtures from exercising the confirm-then-write path they exist to cover.
  '''^tests/fixtures/''',

  # The G6 redaction test (spec §7.4 G6, §10.4). It asserts that `redact()` scrubs real
  # credential shapes, so it MUST contain fake ones to have anything to scrub: a fake JWT,
  # fake `sk-ant-`/`sk-`/`AIza` keys, and `monkeypatch.setenv` values for the `_KEY`/`_TOKEN`/
  # `_SECRET` environment sweep. Every literal here is declared under an explicit
  # "Nothing here is a real key" comment in the file itself.
  '''^tests/unit/test_g6_redact\.py$''',
]

# `docs/.../hr-agentic-rag-design.md` documents the `pto_balances.json` schema, whose
# `accrual_fact_key` field holds an HR accrual-policy slug; `generic-api-key` flags it on
# entropy alone because the JSON key happens to end in `key`. Matched against the captured
# secret and anchored, so this exempts that one literal value and nothing else — `docs/` as
# a path stays fully scanned by every rule.
regexes = [
  '''^pto\.accrual\.ft_3y_plus$''',
]

# ── `curl-auth-header` in the two build/CI files ────────────────────────────────────────────────
# The rule reads whatever follows `Authorization: Bearer` on a curl invocation as a credential, and
# it is right to. Three findings in this repository's history are not credentials:
#
#   * `Makefile` — the 512 MB memory gate's `local-memory-gate`. The Makefile mints it, hands it to
#     one container bound to `127.0.0.1`, and `docker rm -f`s that container ten seconds later.
#   * `.github/workflows/ci.yml`, twice — `ci-access-token`, the same shape for the docker job's
#     equally ephemeral container.
#
# **Both are already gone at HEAD.** The Makefile builds its header into `$AUTH_HEADER` *before* the
# curl and passes `-H "$AUTH_HEADER"`, so no literal sits on a curl line for the rule to read, and
# the CI docker job makes no gated call at all any more (§15.2). This carve-out exists because the
# scan reads **history**: commit `16edf18` still carries both lines and no later commit can change
# what an earlier one contains.
#
# `condition = "AND"` binds all three criteria at once — the finding must come from
# `curl-auth-header`, **and** from one of these two files, **and** carry one of these three line
# shapes. Any other rule, any other file, or any other token behind `Bearer` in these same two files
# is still reported. Nothing here touches `src/`, `scripts/`, `mcp/` or `.env*`.
[[allowlists]]
description = "curl-auth-header: the Makefile / CI docker-job throwaway container tokens, and `Bearer $VAR` placeholders"
targetRules = ["curl-auth-header"]
condition = "AND"
paths = [
  '''^Makefile$''',
  '''^\.github/workflows/ci\.yml$''',
]
regexTarget = "line"
regexes = [
  '''Bearer[ \t]+\$''',                    # a make/shell variable expansion, never a literal
  '''Bearer[ \t]+ci-access-token\b''',     # .github/workflows/ci.yml, historic (removed at 05bb244)
  '''Bearer[ \t]+local-memory-gate\b''',   # Makefile, historic (removed by this commit)
]

# ── `generic-api-key` on README.md's `Deployed:` line ───────────────────────────────────────────
# The grader's entry point is a tokenized link — `https://…onrender.com/?access=<43 chars>` — and
# the 43-character `secrets.token_urlsafe(32)` value in it trips `generic-api-key` on entropy
# alone. It is **intentionally public**: spec §11 makes the token a speed bump against drive-by
# scanners, not a secret, and the grader has to be handed it in the repository to open the
# deployment at all. It guards nothing but synthetic HR data behind a read-mostly UI, and it is
# **rotated after grading** — `deployed.md` § *Access* has the procedure: delete `APP_ACCESS_TOKEN`
# from the Render service, then `RENDER_API_KEY=… python scripts/provision_render.py` mints a new
# one. Written out exactly once in the repository, on that one line of README.md.
#
# `condition = "AND"` binds all three criteria: the finding must come from `generic-api-key`, in
# `README.md`, on a line carrying `?access=<43 url-safe chars>`. Any other rule, any other file, or
# any other high-entropy string in README.md is still reported — and every existing allowlist above
# is untouched.
[[allowlists]]
description = "generic-api-key: README.md's `Deployed:` grader link, whose ?access= token is public by design (§11) and rotated after grading"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^README\.md$''',
]
regexTarget = "line"
regexes = [
  '''\?access=[A-Za-z0-9_-]{43}(?:\b|$)''',
]

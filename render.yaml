# Render Blueprint for the single Hobby (free) web service (spec §14.1).
#
# `autoDeploy: false` is half of the R8.4 argument: Render's own Auto-Deploy is off, so the ONLY
# path from a commit to the running service is the deploy that CI's `deploy` job triggers — through
# `POST /v1/services/{id}/deploys` with `RENDER_API_KEY` and `RENDER_SERVICE_ID`, or through the
# deploy hook when `RENDER_DEPLOY_HOOK_URL` happens to be set (no REST endpoint publishes it, so the
# API call is the path that actually runs). Either way that job carries `needs: [test, docker]`, so
# a red suite cannot reach production.
#
# `scripts/provision_render.py` creates the service from these same values over the REST API and
# populates every `sync: false` variable, so this file is both the committed description of the
# service and the fallback for a manual Blueprint deploy if the API key is ever unavailable.
services:
  - type: web
    name: mosaic-hr-copilot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false                 # deploys arrive ONLY from CI's `deploy` job
    envVars:
      - { key: APP_ENV,         value: render }
      - { key: LLM_PROVIDER,    value: anthropic }
      - { key: LLM_MODEL,       value: claude-haiku-4-5 }
      - { key: OMP_NUM_THREADS, value: "1" }
      # The MCP mount's Host allowlist (§8.1). The SDK's Streamable HTTP transport auto-enables DNS
      # rebinding protection with a loopback-only allowlist, so without the public hostname here the
      # deployed endpoint answers `421 Invalid Host header` to every external MCP client. The two
      # loopback entries stay: the agent reaches its own tools at http://127.0.0.1:${PORT}.
      - { key: MCP_ALLOWED_HOSTS, value: "127.0.0.1:*,localhost:*,mosaic-hr-copilot.onrender.com" }
      # The in-process keep-alive (§14.4). Unset, the self-ping does not run and the instance spins
      # down after 15 minutes idle; a blueprint redeploy would silently undo an operator's value, so
      # the blueprint carries it.
      - { key: KEEP_ALIVE_URL,        value: "https://mosaic-hr-copilot.onrender.com" }
      - { key: KEEP_ALIVE_INTERVAL_S, value: "600" }
      # GIT_SHA: Render exposes RENDER_GIT_COMMIT automatically and settings.py resolves
      # GIT_SHA -> RENDER_GIT_COMMIT -> "dev"; smoke_deployed.py asserts it is not "dev".
      - { key: ANTHROPIC_API_KEY,  sync: false }   # the agent (§9.8)
      - { key: JUDGE_API_KEY,      sync: false }   # Gemini judge — paid billing since 2026-09-10 (§9.8)
      - { key: LLM_FALLBACK_API_KEY, sync: false } # Gemini failover — its own Cloud project, still free
      - { key: TURSO_DATABASE_URL, sync: false }   # REQUIRED (§19.1 item 3)
      - { key: TURSO_AUTH_TOKEN,   sync: false }   # REQUIRED (§19.1 item 3)
      - { key: APP_ACCESS_TOKEN,   sync: false }   # REQUIRED on the graded deployment; provision_render.py
                                                   #   generates it with secrets.token_urlsafe(32)

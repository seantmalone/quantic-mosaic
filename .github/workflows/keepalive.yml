name: keepalive

# The SECOND layer of the keep-alive (spec §14.4, `deployed.md` § *Cold start* → *Keep-alive*).
#
# Render spins a free instance down after 15 idle minutes, and waking it costs a median 71.0 s to
# the first answer (n=3, measured without any keep-alive and published in `deployed.md`). A ping
# every ten minutes keeps the container resident, so a grader who leaves the tab open gets the warm
# ~22.5 s turn instead. The measurement is published first and mitigated second, deliberately: the
# table in `deployed.md` stays exactly as measured, and this file is the reversible mitigation.
#
# **This schedule is not the primary mechanism, because it does not actually run.** GitHub's cron
# is best-effort and de-prioritises low-traffic repositories: in the nine hours after this file was
# pushed, the `*/10` schedule below ran **twice** — 09:48Z and 13:53Z on 2026-09-11, both green —
# and the instance was found spun down at 14:25Z. The primary keep-alive is therefore in the app
# itself (`web/main.py`'s `_keep_alive`, `KEEP_ALIVE_URL` / `KEEP_ALIVE_INTERVAL_S`): a background
# task that GETs the service's own public `/health`, which is inbound traffic at Render's edge and
# needs no scheduler at all. This workflow stays because the two layers cover each other's gap —
# an in-process loop cannot run in an instance that is already asleep, and this job can wake one.
#
# **What it costs.** An always-on free instance consumes ~744 instance-hours in a 31-day month
# (24 × 31) against the workspace's 750 free hours, so this workflow spends nearly the whole
# monthly allowance. Exhausting it suspends every free service until the month resets — Render
# never bills for it. `scripts/check_render_hours.py` warns above 600 of 750.
#
# **How to turn it off.** GitHub → Actions → *keepalive* → ⋯ → *Disable workflow*; the schedule
# stops, the instance goes back to spinning down, and `deployed.md`'s measured table is again the
# behaviour a visitor sees. Re-enabling is the same menu.
#
# The repo is public, so Actions minutes are free. `/health` is an open route (§11.5), so this job
# holds no secret and needs no `GITHUB_TOKEN` scope — hence `permissions: {}`. The URL comes from
# the repository *variable* `DEPLOY_URL` and falls back to the committed live origin, which is what
# resolves today: `DEPLOY_URL` exists as a repository **secret** for CI's `deploy` job, and there is
# deliberately no secret here — the live URL is written out in `README.md` anyway, and a masked
# value would only make this job's log harder to read.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # A cold instance answers `/health` in ~45 s and the curl budget below is 60 s, so a 1-minute
    # job timeout would cancel a legitimate probe — and a cancelled job is a red job, which is
    # exactly what this workflow must never produce. Two minutes bounds the runner without
    # racing the probe it exists to make.
    timeout-minutes: 2
    permissions: {}
    env:
      DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://mosaic-hr-copilot.onrender.com' }}
    steps:
      # No checkout: there is nothing in the repository this job needs. `jq` is preinstalled on
      # `ubuntu-latest`. Every failure path warns and exits 0 — a suspended free tier, a Render
      # outage or a network blip is news for the Actions tab, not a red mark on `main`.
      - name: Ping /health
        run: |
          set -u
          url="${DEPLOY_URL%/}/health"
          body="$(curl -sS --fail --retry 3 --retry-delay 5 --retry-all-errors \
                    --retry-max-time 60 --max-time 60 "$url" || true)"
          summary="$(printf '%s' "$body" \
            | jq -er '"status=\(.status)  app.cold_start=\(.app.cold_start)  app.uptime_ms=\(.app.uptime_ms)"' \
            2>/dev/null || true)"
          if [ -n "$summary" ]; then
            echo "awake — $summary"
            printf '%s\n' "**Awake.** \`$url\` — $summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no usable /health payload from $url inside the 60 s budget — the service may be deploying, or the workspace's 750 free instance-hours may be exhausted for the month (deployed.md § Cold start → Keep-alive)."
            printf '%s\n' "**No answer.** \`$url\` returned no usable \`/health\` payload within 60 s — deploying, or the free instance-hours are gone for the month." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

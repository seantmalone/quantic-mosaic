name: ci

on:
  push:
    branches: [main]
    # Repo-root docs only — `*.md` does not cross a `/`, so `corpus/**` stays gated.
    paths-ignore: ['evaluation/results/**', 'evaluation/REPORT.md', 'docs/**', '*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Run the suite, then redeploy the dispatched ref'
        default: 'false'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version-file: '.python-version' }
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - uses: gitleaks/gitleaks-action@v2            # full history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: stub
      PYTHONPATH: src                              # belt-and-braces; `pip install -e .` below is what puts
                                                   # `hrmosaic` on the path, exactly as `make setup` does
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: '.python-version' }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip install -e .                      # same last step as `make setup`
      - uses: actions/cache@v4                       # the ONLY network fetch on this path
        with: { path: .cache/fastembed, key: fastembed-bge-small-en-v1.5-v1 }
      - run: python -m hrmosaic.rag.download_model   # a no-op on a cache hit
      - run: python scripts/check_facts.py           # corpus quotes verbatim, heading paths real (P2)
      - run: python -m hrmosaic.rag.ingest --verify-manifest   # R1.4, and it leaves a real index for the suite
      - run: pytest -q                               # the WHOLE suite
      - run: python scripts/pii_check.py             # no SSN shapes / non-.example addresses / non-555 numbers

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: '.python-version' }
      - run: docker build -t mosaic-hr --build-arg GIT_SHA=${{ github.sha }} .
      - name: sqlite-vec loads on Debian     # enable_load_extension -> sqlite_vec.load -> vec_version()
        run: docker run --rm -v "$PWD":/w -w /w python:3.12-slim sh -c "pip install -q sqlite-vec && python scripts/probe_sqlite_vec.py"
      - run: docker run -d --name app -p 8000:8000 -e LLM_PROVIDER=stub -e PORT=8000 -e APP_ACCESS_TOKEN=ci-access-token mosaic-hr
      - run: python scripts/wait_for_health.py --url http://127.0.0.1:8000 --timeout 120
      - run: python scripts/assert_health.py --url http://127.0.0.1:8000   # mcp.connected, tool_count==9,
                                                                          # index.loaded, doc_count==14
      - name: the image ships its templates and its static assets
        # P9 carry-forward: the Jinja templates and the vendored assets live under `src/` and are
        # reached through PYTHONPATH, not through a wheel — so only rendering a page proves they
        # shipped. Both calls are on OPEN routes, because §15.2 says this job makes **no gated
        # call**: `/access` is the key page of §11.8 (never gated, and a real Jinja render of
        # `access.html`), and `/static/*` needs no header at all. The MCP handshake `/dashboard`
        # used to prove is already asserted, without a credential, by `assert_health.py`'s
        # `mcp.connected` + `tool_count == 9`.
        run: |
          curl -fsS -o /dev/null http://127.0.0.1:8000/access
          curl -fsS -o /dev/null http://127.0.0.1:8000/static/app.css
      - if: always()
        run: docker logs app && docker rm -f app

  deploy:      # see §14.5
    needs: [test, docker]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_only == 'true')
    runs-on: ubuntu-latest
    env: { DEPLOY_URL: "${{ secrets.DEPLOY_URL }}" }
    steps:
      # First, and deliberately loud: without these there is no deploy, and a job that skipped
      # quietly would look identical to a green one in the job graph. DEPLOY_URL is guarded here
      # too — `wait_for_deploy.py --url ""` and `smoke_deployed.py --url ""` reject an empty or
      # schemeless URL by name, but the reason belongs at the top of the job, not three steps in.
      - name: The deploy secrets must exist
        env: { RENDER_DEPLOY_HOOK_URL: "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" }
        run: |
          missing=""
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then missing="RENDER_DEPLOY_HOOK_URL"; fi
          if [ -z "$DEPLOY_URL" ]; then missing="${missing:+$missing and }DEPLOY_URL"; fi
          if [ -n "$missing" ]; then
            echo "::error::$missing is not set. The Render service has not been provisioned yet:"
            echo "::error::see NEEDS-FROM-USER.md (gate 2 = the Render GitHub App, gate 4 = the Render API key),"
            echo "::error::then run scripts/provision_turso.py and scripts/provision_render.py."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version-file: '.python-version' }
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env: { RENDER_DEPLOY_HOOK_URL: "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" }
      - run: python scripts/wait_for_deploy.py --url "$DEPLOY_URL" --timeout 900
      - run: python scripts/smoke_deployed.py --url "$DEPLOY_URL"
